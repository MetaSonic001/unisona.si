[project]
name = "unisona-api"
version = "0.1.0"
description = "Unisona backend: API, brain, voice gateway and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "rich>=13.7",
  "orjson>=3.10",
  "openai>=1.50",
  "chromadb>=1.0",
  "fastembed>=0.4",
  "bm25s>=0.2",
  "flashrank>=0.2",
  "pymupdf4llm>=0.0.17",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "duckdb>=1.1",
  "trafilatura>=1.12",
  "beautifulsoup4>=4.12",
  "phonenumbers>=8.13",
  "edge-tts>=7.0",
  "pipecat-ai[webrtc,silero,groq,openai,local-smart-turn-v3,google,sarvam,deepgram,cartesia,elevenlabs,rnnoise]>=0.0.90",
  "websockets>=13",
  "email-validator>=2.2",
  "tiktoken>=0.7",
  "langdetect>=1.0.9",
  "mcp>=1.12",
]

[project.optional-dependencies]
local-voice = ["kokoro-onnx>=0.4", "faster-whisper>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
